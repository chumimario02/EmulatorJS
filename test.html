<!DOCTYPE html>
<html>
<head>
<title>Test Netplay Input</title>
<style>
  html, body { margin:0; padding:0; background:#111; height:100%; }
  #game { width:640px; height:480px; margin:20px auto; }
</style>
</head>
<body>
<div id="game"></div>
<button id="netplayBtn" style="position:fixed;top:10px;right:10px;z-index:9999;padding:8px 12px;background:#4caf50;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;">Netplay</button>
<script>
  document.getElementById('netplayBtn').addEventListener('click', function(){
    if (window.EJS_emulator && window.EJS_emulator.netplay) {
      window.EJS_emulator.netplay.createNetplayMenu();
      window.EJS_emulator.netplay.openMenu();
    }
  });
</script>
<script>
  window.EJS_player = "#game";
  window.EJS_core = "segaMD";
  window.EJS_gameUrl = "roms/rom.bin";
  window.EJS_pathtodata = "data/";
  window.EJS_DEBUG_XX = true;
  window.EJS_netplayServer = "http://localhost:3000";
  window.EJS_gameID = "testgame1";
  window.EJS_startOnLoaded = true;
  window.EJS_color = "#212121";
</script>
<script src="data/loader.js"></script>
</body>
</html>
